[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "unit: fonction isolée, sans base de données ni vrai modèle (rapide)",
    "integration: base de données réelle et/ou modèle exporté",
    "functional: API appelée en HTTP, de bout en bout",
]

[tool.coverage.run]
source = ["app", "src"]
branch = true  # couvre aussi chaque branche des if/else, pas seulement les lignes

[tool.coverage.report]
fail_under = 85  # la CI échoue en dessous (couverture actuelle : voir docs/tests.md)
show_missing = true
skip_empty = true
exclude_also = ['if __name__ == "__main__":']

[tool.coverage.html]
directory = "htmlcov"
title = "Turnover API - couverture des tests"

[tool.coverage.xml]
output = "coverage.xml"
