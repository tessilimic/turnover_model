name: Deploy (Hugging Face Spaces + GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch: # manual run from the Actions tab

permissions:
  contents: read

# Never cancel a deployment halfway; queue the next one instead.
concurrency:
  group: deploy-hf-space
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yaml

  deploy:
    name: Push to Space
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, a shallow clone can't be pushed
          lfs: true

      - name: Check configuration
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ vars.HF_USERNAME }}
          HF_SPACE_NAME: ${{ vars.HF_SPACE_NAME }}
        run: |
          missing=0
          [ -n "$HF_TOKEN" ]      || { echo "::error::Secret HF_TOKEN is not set"; missing=1; }
          [ -n "$HF_USERNAME" ]   || { echo "::error::Variable HF_USERNAME is not set"; missing=1; }
          [ -n "$HF_SPACE_NAME" ] || { echo "::error::Variable HF_SPACE_NAME is not set"; missing=1; }
          exit $missing

      # Force push: the Space repo has its own initial history.
      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ vars.HF_USERNAME }}
          HF_SPACE_NAME: ${{ vars.HF_SPACE_NAME }}
        run: |
          git push --force \
            "https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/${HF_SPACE_NAME}" \
            HEAD:main

      - name: Summary
        run: |
          echo "Deployed to https://huggingface.co/spaces/${{ vars.HF_USERNAME }}/${{ vars.HF_SPACE_NAME }}" >> "$GITHUB_STEP_SUMMARY"

  # Documentation site (MkDocs + Sphinx in /code/ + coverage report in /coverage/) on GitHub Pages.
  # Independent from the Space: a failed Space push doesn't block the docs.
  # One-time setup: Settings > Pages > Source: "GitHub Actions".
  pages:
    name: Publish docs to GitHub Pages
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-docs.txt

      - name: Install dependencies
        run: pip install -r requirements-docs.txt

      - name: Build site
        run: |
          mkdocs build --strict
          sphinx-build -W -b html sphinx site/code

      # Coverage report produced by the CI job of this same run (reusable workflow).
      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: coverage-report

      - name: Add coverage report to the site
        run: cp -r coverage-report/htmlcov site/coverage

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
