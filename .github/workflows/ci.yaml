name: CI

on:
  push:
  pull_request:
  workflow_call: # reused by deploy.yaml

permissions:
  contents: read

# github.workflow = caller's name when called from deploy.yaml,
# so the CI run and the deploy run on main don't cancel each other.
concurrency:
  group: ${{ github.workflow }}-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    # Tests run against a real PostgreSQL (same version as docker-compose.yml).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: turnover
          POSTGRES_PASSWORD: turnover
          POSTGRES_DB: turnover_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U turnover -d turnover_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://turnover:turnover@localhost:5432/turnover_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true # model/*.joblib is stored in Git LFS

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        run: pytest --cov --cov-report=term-missing

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build image
        run: docker build -t turnover-api:ci .
