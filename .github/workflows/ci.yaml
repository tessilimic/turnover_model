name: CI

on:
  push:
  pull_request:
  workflow_call: # reused by deploy.yaml

permissions:
  contents: read

# github.workflow = caller's name when called from deploy.yaml,
# so the CI run and the deploy run on main don't cancel each other.
concurrency:
  group: ${{ github.workflow }}-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    # Tests run against a real PostgreSQL (same version as docker-compose.yml).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: turnover
          POSTGRES_PASSWORD: turnover
          POSTGRES_DB: turnover_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U turnover -d turnover_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://turnover:turnover@localhost:5432/turnover_test
      # Throwaway CI database: role tests may (re)define the application roles' passwords.
      TEST_ROLES_PG: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true # model/*.joblib is stored in Git LFS

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # One step per category (markers set from tests/<category>/),
      # coverage (lines + branches, see pyproject.toml) accumulated across steps.
      # --cov-fail-under=0: each category alone covers only part of the code; the
      # threshold applies once, to the accumulated total (step "Coverage threshold").
      - name: Unit tests
        run: pytest -m unit --cov --cov-report= --cov-fail-under=0

      - name: Integration tests (PostgreSQL, exported model)
        run: pytest -m integration --cov --cov-append --cov-report= --cov-fail-under=0

      - name: Functional tests (API over HTTP)
        run: pytest -m functional --cov --cov-append --cov-report= --cov-fail-under=0

      # Reports are produced even if a test step failed (partial coverage helps to debug).
      - name: Coverage report (HTML, XML, job summary)
        if: ${{ !cancelled() }}
        run: |
          [ -f .coverage ] || { echo "No coverage data (tests did not run)."; exit 0; }
          coverage xml --fail-under=0
          coverage html --fail-under=0
          {
            echo "## Couverture des tests"
            echo
            coverage report --format=markdown --fail-under=0
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            htmlcov/
            coverage.xml
          retention-days: 30
          if-no-files-found: ignore

      # Quality gate: fails below [tool.coverage.report] fail_under in pyproject.toml.
      - name: Coverage threshold
        run: coverage report

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build image
        run: docker build -t turnover-api:ci .

  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install audit tools
        run: pip install pip-audit bandit

      # Known vulnerabilities (PyPI advisory database) in the pinned dependencies.
      - name: Dependency audit (pip-audit)
        run: pip-audit -r requirements.txt

      # Static analysis of the application code (hardcoded secrets, injections, ...).
      - name: Code scan (bandit)
        run: bandit -r app src scripts

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-docs.txt

      - name: Install dependencies
        run: pip install -r requirements-docs.txt

      - name: Check OpenAPI export is up to date
        run: |
          python -m scripts.export_openapi
          git diff --exit-code docs/api/openapi.json

      # Strict: broken links, pages missing from nav or invalid docstrings fail the build.
      - name: Build MkDocs site
        run: mkdocs build --strict

      - name: Build Sphinx code reference
        run: sphinx-build -W -b html sphinx site/code

      - name: Upload documentation site
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: site/
